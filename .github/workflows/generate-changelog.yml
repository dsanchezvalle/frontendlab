# CORE: agnostic
# Append a date-grouped entry to CHANGELOG.md when commits land on develop.
# Same-day pushes consolidate under a single `## YYYY-MM-DD` heading.
# Skips its own commits via [skip ci] in the subject.
name: Generate Changelog

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine cut-off and today's date
        id: cut
        run: |
          set -euo pipefail
          LAST_DATE=""
          if [ -f CHANGELOG.md ]; then
            LAST_DATE=$(grep -m1 -E '^## [0-9]{4}-[0-9]{2}-[0-9]{2}' CHANGELOG.md | awk '{print $2}' || true)
          fi
          echo "last_date=${LAST_DATE}" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Collect new commits since last entry
        id: collect
        env:
          LAST: ${{ steps.cut.outputs.last_date }}
          TODAY: ${{ steps.cut.outputs.today }}
        run: |
          set -euo pipefail

          # Range: from LAST through HEAD. If no LAST, full history.
          # Use a bash array so that an empty range expands to no
          # arguments (git log <empty>) — quoting "$RANGE" with a
          # non-array would pass an empty string to git as a revision
          # and fail.
          if [ -n "$LAST" ]; then
            RANGE_ARGS=("--since=$LAST")
          else
            RANGE_ARGS=()
          fi

          # Conventional subjects only; exclude back-merges and skip-changelog.
          COMMITS=$(git log "${RANGE_ARGS[@]}" --no-merges --pretty=format:'%s' \
            | grep -Ev '^back-merge:' \
            | grep -Ev '\[skip changelog\]' \
            | grep -E '^(feat|fix|docs|refactor|chore|test|perf|build|ci)(\([^)]+\))?: ' || true)

          if [ -z "$COMMITS" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          # Sort: feat first, fix second, then everything else; alphabetical within each group.
          {
            echo "$COMMITS" | grep -E '^feat'                | sort | sed 's/^/- /'
            echo "$COMMITS" | grep -E '^fix'                 | sort | sed 's/^/- /'
            echo "$COMMITS" | grep -Ev '^(feat|fix)'         | sort | sed 's/^/- /'
          } > /tmp/new_entries.txt

          {
            echo 'entries<<__ENTRIES_EOF__'
            cat /tmp/new_entries.txt
            echo '__ENTRIES_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Write CHANGELOG.md
        if: steps.collect.outputs.has_changes == 'true'
        env:
          ENTRIES: ${{ steps.collect.outputs.entries }}
          TODAY:   ${{ steps.cut.outputs.today }}
          LAST:    ${{ steps.cut.outputs.last_date }}
        run: |
          set -euo pipefail
          touch CHANGELOG.md

          if [ "$LAST" = "$TODAY" ]; then
            # Insert under the existing today heading. Find the line of `## $TODAY`,
            # then insert ENTRIES immediately after the blank line that follows it,
            # preserving the existing entries below.
            python3 - <<PY
import re, os, pathlib
path = pathlib.Path("CHANGELOG.md")
text = path.read_text()
today = os.environ["TODAY"]
new_entries = os.environ["ENTRIES"].rstrip("\n").splitlines()
heading = f"## {today}"
lines = text.splitlines()
try:
    idx = next(i for i, ln in enumerate(lines) if ln.strip() == heading)
except StopIteration:
    raise SystemExit("Expected today's heading not found; aborting.")
# Find the start of the existing entry block (skip blank line(s) right after heading).
i = idx + 1
while i < len(lines) and lines[i].strip() == "":
    i += 1
# Collect existing entries for today (consecutive lines starting with "- ").
start = i
while i < len(lines) and lines[i].startswith("- "):
    i += 1
existing = lines[start:i]
# Merge: existing + new, then re-sort with feat / fix / rest.
merged = existing + new_entries
def bucket(line):
    body = line[2:]  # strip "- "
    if body.startswith("feat"): return 0
    if body.startswith("fix"):  return 1
    return 2
# Stable de-dup while preserving content; sort within buckets.
seen = set()
deduped = []
for ln in merged:
    if ln not in seen:
        seen.add(ln)
        deduped.append(ln)
deduped.sort(key=lambda ln: (bucket(ln), ln.lower()))
new_lines = lines[:start] + deduped + lines[i:]
path.write_text("\n".join(new_lines) + ("\n" if text.endswith("\n") else ""))
PY
          else
            # Prepend a brand-new dated block above whatever is currently on top.
            {
              echo "## $TODAY"
              echo
              printf '%s\n' "$ENTRIES"
              echo
              cat CHANGELOG.md
            } > CHANGELOG.md.new
            mv CHANGELOG.md.new CHANGELOG.md
          fi

      - name: Commit
        if: steps.collect.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(changelog): update [skip ci]'
          git push
